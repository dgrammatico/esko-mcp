name: WebCenter MCP

on:
  push:
    branches: [main]
    tags: ["webcenter-v*"]
    paths: ["webcenter/**", ".github/workflows/webcenter.yml"]
  pull_request:
    paths: ["webcenter/**", ".github/workflows/webcenter.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webcenter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webcenter/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: esko-webcenter-mcpb
          path: webcenter/dist/*.mcpb
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/webcenter-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb ../docs/INSTALL-WebCenter.md \
            --title "Esko WebCenter MCP ${GITHUB_REF_NAME#webcenter-v}" \
            --notes-file ../docs/RELEASE-NOTES-WebCenter.md || \
          gh release upload "$GITHUB_REF_NAME" dist/*.mcpb --clobber
