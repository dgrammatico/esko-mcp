name: WebCenter MCP

on:
  push:
    branches: [main]
    tags: ["webcenter-v*"]
    paths: ["webcenter/**", ".github/workflows/webcenter.yml"]
  pull_request:
    paths: ["webcenter/**", ".github/workflows/webcenter.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webcenter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webcenter/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/pack.mjs
      - run: node scripts/pack-remote.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: esko-webcenter-packages
          path: |
            webcenter/dist/*.mcpb
            webcenter/dist/*.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/webcenter-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb dist/*.zip ../docs/INSTALL-WebCenter.md ../docs/COPILOT-SETUP.md \
            --title "Esko WebCenter MCP ${GITHUB_REF_NAME#webcenter-v}" \
            --notes-file ../docs/RELEASE-NOTES-WebCenter.md || \
          gh release upload "$GITHUB_REF_NAME" dist/*.mcpb dist/*.zip --clobber

  image:
    # Builds the remote-edition container and publishes it to GitHub's container registry (private, like this repo).
    needs: build-test-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/esko-webcenter-mcp
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=webcenter-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/webcenter-v') }}
      - uses: docker/build-push-action@v6
        with:
          context: webcenter
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
